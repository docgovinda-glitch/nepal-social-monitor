services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nepal-media-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - hf_cache:/home/appuser/.cache/huggingface
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  hf_cache:
    name: nepal_media_hf_cache
