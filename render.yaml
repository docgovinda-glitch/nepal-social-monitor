services:
  - type: web
    name: nepal-social-monitor-worker
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements-worker.txt"
    startCommand: "python render_worker_server.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: GREEN_API_URL
        sync: false
      - key: GREEN_API_ID_INSTANCE
        sync: false
      - key: GREEN_API_TOKEN_INSTANCE
        sync: false
      - key: GREEN_API_CHAT_ID
        sync: false
      - key: WHATSAPP_CHANNEL_URL
        sync: false
      - key: SUPABASE_PROJECT_REF
        value: "iiztmvbfrydfowehtiqa"
      - key: TWITTER_BEARER_TOKEN
        sync: false
      - key: MAX_BROADCAST_PER_CYCLE
        value: "0"

