name: Nepal News Monitoring Cycle

on:
  schedule:
    # Run every 15 minutes, shifted off-the-hour to avoid GitHub Actions scheduling jitter
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

concurrency:
  group: news-monitor-run
  cancel-in-progress: false

jobs:
  monitor-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-backend.txt

      - name: Static Hugging Face Model Cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-nllb-ct2-int8-v1

      - name: Rolling SQLite Translation Cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/translation_cache
          key: translation-cache-${{ github.run_id }}
          restore-keys: |
            translation-cache-

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-backend.txt

      - name: Run single news monitoring cycle
        env:
          SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_POOLER_HOST: ${{ secrets.SUPABASE_POOLER_HOST }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          ENABLE_LOCAL_TRANSLATION_FALLBACK: "true"
          TRANSLATION_CACHE_DIR: ${{ github.workspace }}/.cache/translation_cache
          GREEN_API_URL: ${{ secrets.GREEN_API_URL }}
          GREEN_API_ID_INSTANCE: ${{ secrets.GREEN_API_ID_INSTANCE }}
          GREEN_API_TOKEN_INSTANCE: ${{ secrets.GREEN_API_TOKEN_INSTANCE }}
          GREEN_API_CHAT_ID: ${{ secrets.GREEN_API_CHAT_ID }}
          GREEN_API_SENDING_ENABLED: "false"
        run: |
          python nepal_news_scheduler.py
