name: 24/7 WhatsApp News Broadcast Worker

on:
  schedule:
    # Runs every 1 hour from 06:00 AM to 10:00 PM Nepal Time (OFF 10:00 PM to 06:00 AM)
    # Nepal Time is UTC+5:45 -> 00:15 UTC = 06:00 AM NPT, 16:15 UTC = 10:00 PM NPT
    # 17 runs/day (~510 min/month, uses only ~25% of GitHub free quota)
    - cron: '15 0-16 * * *'
  workflow_dispatch: # Allows 1-click manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  broadcast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-worker.txt

      - name: Run Broadcast Scan Cycle
        env:
          GREEN_API_URL: ${{ secrets.GREEN_API_URL || 'https://7107.api.greenapi.com' }}
          GREEN_API_ID_INSTANCE: ${{ secrets.GREEN_API_ID_INSTANCE || '710722796757' }}
          GREEN_API_TOKEN_INSTANCE: ${{ secrets.GREEN_API_TOKEN_INSTANCE || '40dbc295b8de41de8b8d80f40e664537350f170c25a0456fba' }}
          GREEN_API_CHAT_ID: ${{ secrets.GREEN_API_CHAT_ID || '120363413358977926@g.us' }}
          WHATSAPP_CHANNEL_URL: ${{ secrets.WHATSAPP_CHANNEL_URL || 'https://whatsapp.com/channel/0029Vb92VH61iUxbhQ4HpB38' }}
          BROADCAST_INTERVAL_SECONDS: '3600'
          MAX_BROADCAST_PER_CYCLE: '0'
          TWITTER_CONSUMER_KEY: ${{ secrets.TWITTER_CONSUMER_KEY || 'o3UzORYoi7dfmbBnmjaXbs3XJ' }}
          TWITTER_CONSUMER_SECRET: ${{ secrets.TWITTER_CONSUMER_SECRET || 'TkP3an7rMxArcubWX7ZqB2WiKX98gNFlRmtiTcknj1YOgnPYdi' }}
          TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN || 'AAAAAAAAAAAAAAAAAAAAAKbmAAIAAAAADmKXtTCtu6uztaV4tEowwgZNoUs=fX7rkbMSJpgLrZf4LGzlJUXS6t81DTLcgcBmsepb4tLOzRce3w' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'AQ.Ab8RN6KYwIu1NCTWx479PKYiRJPdydm6MITVvswI6ruy0OSLbA' }}
        run: |
          python whatsapp_auto_worker.py --once

      - name: Commit and push updated sent cache
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add whatsapp_sent_cache.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(cache): sync whatsapp broadcast history [skip ci]" && git push)
