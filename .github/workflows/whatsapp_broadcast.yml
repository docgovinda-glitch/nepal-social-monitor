name: 24/7 WhatsApp News Broadcast Worker

on:
  schedule:
    # Runs at minute 15 of every hour from 00:15 UTC to 16:15 UTC
    # In Nepal Time (UTC+5:45), this corresponds exactly to 06:00 NPT to 22:00 NPT (every hour)
    # 00:15 UTC = 06:00 NPT (Morning batch: sweeps 10 PM to 6 AM overnight stories)
    # 16:15 UTC = 22:00 NPT (Final night cycle)
    # No runs scheduled between 17:00 UTC and 23:59 UTC (10 PM to 6 AM quiet window)
    - cron: '15 0-16 * * *'
  workflow_dispatch: # Allows 1-click manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  broadcast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-worker.txt

      - name: Run Broadcast Scan Cycle
        env:
          GREEN_API_URL: ${{ secrets.GREEN_API_URL }}
          GREEN_API_ID_INSTANCE: ${{ secrets.GREEN_API_ID_INSTANCE }}
          GREEN_API_TOKEN_INSTANCE: ${{ secrets.GREEN_API_TOKEN_INSTANCE }}
          GREEN_API_CHAT_ID: ${{ secrets.GREEN_API_CHAT_ID }}
          WHATSAPP_CHANNEL_URL: ${{ secrets.WHATSAPP_CHANNEL_URL }}
          BROADCAST_INTERVAL_SECONDS: '3600'
          MAX_BROADCAST_PER_CYCLE: '0'
          TWITTER_CONSUMER_KEY: ${{ secrets.TWITTER_CONSUMER_KEY }}
          TWITTER_CONSUMER_SECRET: ${{ secrets.TWITTER_CONSUMER_SECRET }}
          TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python whatsapp_auto_worker.py --once

      - name: Commit and push updated sent cache
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add whatsapp_sent_cache.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(cache): sync whatsapp broadcast history [skip ci]" && git push)
