name: Database Retention

on:
  schedule:
    # 02:22 Nepal time every night
    - cron: '37 20 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Count only, delete nothing'
        type: boolean
        default: true
      days:
        description: 'Days of stories to keep (minimum 30)'
        default: '90'

concurrency:
  group: retention-run
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-backend.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psycopg[binary] psycopg-pool requests python-dateutil tzdata

      - name: Delete stories past the retention window
        env:
          SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_POOLER_HOST: ${{ secrets.SUPABASE_POOLER_HOST }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          RETENTION_DAYS: ${{ github.event.inputs.days || '90' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || 'false' }}
        run: python retention_cleanup.py

      - name: Notify on failure
        if: failure()
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -n "$ALERT_WEBHOOK_URL" ]; then
            curl -sS -m 20 -X POST -H 'Content-Type: application/json' \
              -d "{\"text\":\"Media Monitor retention job failed: $RUN_URL\",\"content\":\"Media Monitor retention job failed: $RUN_URL\"}" \
              "$ALERT_WEBHOOK_URL" || true
          else
            echo "::error::Retention job failed ($RUN_URL). Set the ALERT_WEBHOOK_URL secret to get a chat message."
          fi
