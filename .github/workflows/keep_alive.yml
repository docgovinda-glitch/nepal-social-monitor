name: Keep Render Worker Alive

on:
  schedule:
    # Runs every 10 minutes (at minute 0, 10, 20, 30, 40, 50)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Web Service
        run: |
          curl -f -s https://nepal-social-monitor-worker.onrender.com || echo "Ping attempted"

