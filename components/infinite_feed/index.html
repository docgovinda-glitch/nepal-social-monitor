<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style id="base-feed-styles">
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", sans-serif;
    color: #0F172A;
    overflow: hidden;
  }
  #feed-root {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 2px 2px 6px 2px;
  }
  .feed-batch {
    display: flex;
    flex-direction: column;
    gap: 12px;
    content-visibility: auto;
    contain-intrinsic-size: auto 2400px;
  }
  .feed-card-wrap {
    position: relative;
    background: #FFFFFF;
    border: 1px solid rgba(15, 23, 42, 0.09);
    border-radius: 14px;
    padding: 18px 20px 14px 22px;
    overflow: hidden;
    box-shadow: 0 1px 3px rgba(15, 23, 42, 0.03), 0 1px 2px rgba(15, 23, 42, 0.02);
    transition: box-shadow 0.18s ease, border-color 0.18s ease, transform 0.18s ease;
  }
  @media (hover: hover) {
    .feed-card-wrap:hover {
      border-color: rgba(15, 23, 42, 0.18);
      box-shadow: 0 8px 24px -4px rgba(15, 23, 42, 0.06), 0 2px 6px -1px rgba(15, 23, 42, 0.03);
    }
  }
  .feed-card-footer {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 12px;
    padding-top: 11px;
    border-top: 1px solid rgba(15, 23, 42, 0.06);
  }
  .feed-card-footer .chip-row {
    margin-top: 0 !important;
  }
  .feed-card-actions {
    display: inline-flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    margin-left: auto;
  }
  .feed-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-block-size: 34px;
    height: 34px;
    padding: 0 14px;
    border-radius: 999px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    box-sizing: border-box;
    border: 1px solid transparent;
    background: rgba(0, 0, 0, 0.05);
    color: #1D1D1F;
    box-shadow: none;
    transition: background-color 0.14s ease, border-color 0.14s ease, transform 0.08s ease;
    touch-action: manipulation;
  }
  @media (hover: hover) {
    .feed-btn:hover {
      background: rgba(0, 0, 0, 0.08);
      border-color: transparent;
    }
  }
  .feed-btn:active {
    transform: scale(0.985);
  }
  .feed-btn--primary {
    background: #0066CC;
    border-color: #0066CC;
    color: #FFFFFF;
  }
  @media (hover: hover) {
    .feed-btn--primary:hover {
      background: #0052A3;
      border-color: #0052A3;
      color: #FFFFFF;
    }
  }
  .feed-btn svg {
    width: 15px;
    height: 15px;
    flex-shrink: 0;
  }
  /* Read button: the icon cross-fades between "read" and "translate" on a loop (click still fires the Read action) */
  .ico-swap { position: relative; display: inline-block; width: 15px; height: 15px; flex: none; pointer-events: none; }
  .ico-swap svg { position: absolute; inset: 0; width: 15px; height: 15px; will-change: opacity, transform; }
  .ico-swap .ico-read { animation: ico-read 6s ease-in-out infinite; }
  .ico-swap .ico-translate { animation: ico-translate 6s ease-in-out infinite; }
  @keyframes ico-read {
    0%, 38% { opacity: 1; transform: scale(1) rotate(0deg); }
    50%, 88% { opacity: 0; transform: scale(0.6) rotate(-14deg); }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
  }
  @keyframes ico-translate {
    0%, 38% { opacity: 0; transform: scale(0.6) rotate(14deg); }
    50%, 88% { opacity: 1; transform: scale(1) rotate(0deg); }
    100% { opacity: 0; transform: scale(0.6) rotate(14deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .ico-swap .ico-read { animation: none; opacity: 1; }
    .ico-swap .ico-translate { animation: none; opacity: 0; }
  }
  @media (max-width: 640px) {
    #feed-root, .feed-batch {
      gap: 10px;
    }
    .feed-card-wrap {
      padding: 14px 15px 12px 15px;
      border-radius: 12px;
    }
    .feed-card-footer {
      gap: 9px;
      margin-top: 10px;
      padding-top: 10px;
    }
    .feed-card-actions {
      gap: 7px;
    }
    .feed-btn {
      height: 36px;
      min-block-size: 36px;
      min-inline-size: 44px;
      padding: 0 13px;
      font-size: 12px;
    }
  }
  #scroll-sentinel {
    min-height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px 0 6px 0;
  }
  @keyframes nm-shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  .feed-loading-pill span:last-child { background: linear-gradient(90deg, currentColor 0%, currentColor 35%, #0A84FF 50%, currentColor 65%, currentColor 100%); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; animation: nm-shimmer 2.2s linear infinite; }
  .feed-loading-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    border-radius: 999px;
    background: rgba(15, 23, 42, 0.045);
    color: #475569;
    font-size: 12.5px;
    font-weight: 500;
  }
  .feed-spinner {
    width: 13px;
    height: 13px;
    border: 2px solid rgba(15, 23, 42, 0.14);
    border-top-color: #0066CC;
    border-radius: 50%;
    animation: spin 0.75s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .feed-end-caption {
    text-align: center;
    color: #475569;
    font-size: 12.5px;
    padding: 8px 0 4px 0;
  }
  .feed-error-box {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 16px;
    border-radius: 12px;
    background: #FEF2F2;
    border: 1px solid rgba(185, 28, 28, 0.22);
    color: #B91C1C;
    font-size: 13px;
  }
</style>
</head>
<body>
  <div id="theme-style-mount"></div>
  <div id="feed-root"></div>
  <div id="scroll-sentinel"></div>

  <script>
    (function () {
      const feedRoot = document.getElementById("feed-root");
      const sentinel = document.getElementById("scroll-sentinel");
      const themeMount = document.getElementById("theme-style-mount");

      let currentSessionKey = null;
      let renderedSeqs = new Set();
      let renderedRevs = new Map();
      let hasMore = false;
      let inFlight = false;
      let lastRequestedSeq = -1;
      let nextExpectedSeq = 0;
      let lastThemeCss = "";
      let rafPending = false;
      let currentError = "";
      let lastTotalCount = 0;
      let lastLoadedCount = 0;
      let lastNoun = "items";

      function sendMessage(type, payload) {
        window.parent.postMessage(
          Object.assign({ isStreamlitMessage: true, type: type }, payload || {}),
          "*"
        );
      }

      function setFrameHeight() {
        const h = Math.max(document.documentElement.scrollHeight, document.body.scrollHeight, 60);
        sendMessage("streamlit:setFrameHeight", { height: h });
      }

      function emitValue(val) {
        sendMessage("streamlit:setComponentValue", { value: val });
      }

      // Sanitize HTML defensively against script/iframe/inline handlers/unsafe hrefs
      function sanitizeBatchHtml(rawHtml) {
        const tpl = document.createElement("template");
        tpl.innerHTML = rawHtml || "";
        const blocked = tpl.content.querySelectorAll("script, iframe, object, embed, form, meta, base");
        blocked.forEach((el) => el.remove());

        const all = tpl.content.querySelectorAll("*");
        all.forEach((el) => {
          for (const attr of Array.from(el.attributes)) {
            const name = attr.name.toLowerCase();
            if (name.startsWith("on")) {
              el.removeAttribute(attr.name);
            } else if (name === "href" || name === "src" || name === "data-fallback-src") {
              const v = (attr.value || "").trim().toLowerCase();
              const isAllowed = v.startsWith("http://") || v.startsWith("https://") ||
                                v.startsWith("/app/static/") || v.startsWith("app/static/") ||
                                v.startsWith("data:image/") || v === "#";
              if (v && !isAllowed) {
                el.setAttribute(attr.name, "#");
              }
            }
          }
        });
        return tpl.content;
      }

      function renderFooter(totalCount, loadedCount, noun, errorMsg) {
        sentinel.innerHTML = "";
        if (errorMsg) {
          const box = document.createElement("div");
          box.className = "feed-error-box";
          const msg = document.createElement("span");
          msg.textContent = errorMsg;
          const retryBtn = document.createElement("button");
          retryBtn.type = "button";
          retryBtn.className = "feed-btn";
          retryBtn.textContent = "Retry";
          retryBtn.onclick = function () {
            inFlight = true;
            lastRequestedSeq = nextExpectedSeq;
            renderFooter(totalCount, loadedCount, noun, "");
            emitValue({ event: "retry", next_seq: nextExpectedSeq, ts: Date.now() });
          };
          box.appendChild(msg);
          box.appendChild(retryBtn);
          sentinel.appendChild(box);
          return;
        }
        if (hasMore) {
          const pill = document.createElement("div");
          pill.className = "feed-loading-pill";
          const spinner = document.createElement("span");
          spinner.className = "feed-spinner";
          const label = document.createElement("span");
          label.textContent = inFlight
            ? `${["Gathering","Sifting","Scouting","Fetching","Unrolling"][Math.floor(Math.random()*5)]} more ${noun}… ${loadedCount.toLocaleString()} of ${totalCount.toLocaleString()}`
            : `Scroll for more · ${loadedCount.toLocaleString()} of ${totalCount.toLocaleString()} ${noun} loaded`;
          pill.appendChild(spinner);
          pill.appendChild(label);
          sentinel.appendChild(pill);
        } else if (loadedCount > 0) {
          const cap = document.createElement("div");
          cap.className = "feed-end-caption";
          cap.textContent = `You're all caught up · ${loadedCount.toLocaleString()} ${noun}`;
          sentinel.appendChild(cap);
        }
      }

      function checkSentinelInParentViewport() {
        rafPending = false;
        if (!hasMore || inFlight || currentError) return;
        if (lastRequestedSeq === nextExpectedSeq) return;

        let isNearBottom = false;
        try {
          const frame = window.frameElement;
          const parentWin = window.parent;
          if (frame && parentWin) {
            const frameRect = frame.getBoundingClientRect();
            const sentRect = sentinel.getBoundingClientRect();
            const sentTopInParent = frameRect.top + sentRect.top;
            isNearBottom = sentTopInParent <= (parentWin.innerHeight + 300);
          }
        } catch (e) {
          // Cross-origin fallback
          const rect = sentinel.getBoundingClientRect();
          isNearBottom = rect.top <= (window.innerHeight + 300);
        }

        if (isNearBottom) {
          inFlight = true;
          lastRequestedSeq = nextExpectedSeq;
          renderFooter(lastTotalCount, lastLoadedCount, lastNoun, "");
          emitValue({ event: "load_more", next_seq: nextExpectedSeq, ts: Date.now() });
        }
      }

      function scheduleScrollCheck() {
        if (rafPending || !hasMore || inFlight || currentError) return;
        rafPending = true;
        window.requestAnimationFrame(checkSentinelInParentViewport);
      }

      let roRafPending = false;
      function scheduleFrameHeight() {
        if (roRafPending) return;
        roRafPending = true;
        window.requestAnimationFrame(function () {
          roRafPending = false;
          setFrameHeight();
        });
      }

      // Attach capturing scroll listener on parent document and clean up on unload to prevent memory leaks
      // ---- Scroll guard: remember the reader's position; restore it if a re-render/remount resets it ----
      let lastGesture = 0;
      let guardTimer = null;
      let firstRender = true;
      function scrollEl() {
        try { const d = window.parent.document; return d.querySelector('[data-testid="stMain"]') || d.scrollingElement; } catch (e) { return null; }
      }
      function noteScroll() {
        // Only user-driven scrolls are remembered, so a programmatic reset to 0 never overwrites the saved spot.
        if (Date.now() - lastGesture > 2500) return;
        const el = scrollEl(); if (!el) return;
        try { window.parent.__nmScroll = { key: currentSessionKey, y: el.scrollTop }; } catch (e) {}
      }
      function guardScroll(ms) {
        let saved = null;
        try { saved = window.parent.__nmScroll; } catch (e) {}
        if (!saved || saved.key !== currentSessionKey || saved.y < 300) return;
        const started = Date.now();
        if (guardTimer) clearInterval(guardTimer);
        guardTimer = setInterval(function () {
          const el = scrollEl();
          if (!el || lastGesture > started || Date.now() - started > ms) { clearInterval(guardTimer); guardTimer = null; return; }
          if (el.scrollTop < saved.y - 150 && el.scrollHeight > saved.y + el.clientHeight * 0.5) el.scrollTop = saved.y;
        }, 80);
      }
      function markGesture() { lastGesture = Date.now(); }

      // Touches/wheel over the feed happen inside this iframe, so listen here too
      ["touchstart", "touchmove", "touchend", "wheel", "keydown", "mousedown"].forEach(function (evn) {
        document.addEventListener(evn, markGesture, { capture: true, passive: true });
      });

      function bindParentScroll() {
        let pWin = null;
        try {
          pWin = window.parent;
          pWin.addEventListener("scroll", scheduleScrollCheck, { passive: true });
          pWin.addEventListener("resize", scheduleScrollCheck, { passive: true });
          pWin.document.addEventListener("scroll", scheduleScrollCheck, { capture: true, passive: true });
          pWin.document.addEventListener("scroll", noteScroll, { capture: true, passive: true });
          ["touchstart", "touchmove", "touchend", "wheel", "keydown", "mousedown"].forEach(function (evn) {
            pWin.document.addEventListener(evn, markGesture, { capture: true, passive: true });
          });
        } catch (e) {
          pWin = null;
          window.addEventListener("scroll", scheduleScrollCheck, { passive: true });
        }
        window.addEventListener("pagehide", function () {
          try {
            if (pWin) {
              pWin.removeEventListener("scroll", scheduleScrollCheck);
              pWin.removeEventListener("resize", scheduleScrollCheck);
              pWin.document.removeEventListener("scroll", scheduleScrollCheck, { capture: true });
            } else {
              window.removeEventListener("scroll", scheduleScrollCheck);
            }
            ro.disconnect();
          } catch (err) {}
        }, { once: true });
      }

      // Delegated click handler for Read in App / Share buttons
      feedRoot.addEventListener("click", function (ev) {
        const btn = ev.target.closest("button[data-action]");
        if (!btn) return;
        const action = btn.getAttribute("data-action");
        const uid = btn.getAttribute("data-uid");
        if (action && uid) {
          emitValue({ event: "action", action: action, item_uid: uid, ts: Date.now() });
        }
      });

      // Defensive image fallback handler for media logos & author avatars
      document.addEventListener("error", function (e) {
        if (e.target && e.target.tagName === "IMG") {
          const img = e.target;
          const fb = img.getAttribute("data-fallback-src");
          if (fb && img.src !== fb) {
            img.removeAttribute("data-fallback-src");
            img.src = fb;
            return;
          }
          img.style.display = "none";
          if (img.parentElement) {
            img.parentElement.classList.add("hl-fallback");
          }
        }
      }, true);

      document.addEventListener("load", function (e) {
        if (e.target && e.target.tagName === "IMG") {
          e.target.classList.add("hl-loaded");
        }
      }, true);

      const ro = new ResizeObserver(scheduleFrameHeight);
      ro.observe(document.body);

      window.addEventListener("message", function (event) {
        const data = event.data;
        if (!data || data.type !== "streamlit:render") return;
        const args = data.args || {};

        if (args.theme_css && args.theme_css !== lastThemeCss) {
          let osDark = false;
          try { osDark = window.parent.matchMedia("(prefers-color-scheme: dark)").matches; }
          catch (e) { osDark = window.matchMedia("(prefers-color-scheme: dark)").matches; }
          themeMount.innerHTML = args.theme_css.split("@media (prefers-color-scheme: dark) {").join(osDark ? "@media all {" : "@media not all {");
          lastThemeCss = args.theme_css;
        }

        if (args.session_key !== currentSessionKey) {
          currentSessionKey = args.session_key;
          feedRoot.innerHTML = "";
          renderedSeqs = new Set();
          renderedRevs = new Map();
          lastRequestedSeq = -1;
        }

        let patchedNow = false;
        const batches = Array.isArray(args.batches) ? args.batches : [];
        const incomingLoaded = Number(args.loaded_count || 0);
        // Recovery safety guard: if a remounted iframe receives only a delta batch (or empty) when prior batches exist, request full sync
        if (renderedSeqs.size === 0 && incomingLoaded > 0 && !batches.some((b) => b && b.seq === 0)) {
          emitValue({ event: "sync_all", ts: Date.now() });
          return;
        }

        if (batches.length > 0) {
          const appendFrag = document.createDocumentFragment();
          for (const b of batches) {
            if (b && typeof b.seq === "number" && renderedSeqs.has(b.seq) && (b.rev || 0) !== (renderedRevs.get(b.seq) || 0)) {
              // Same batch, patched content (e.g. sent tick): swap in place, no scroll change
              const cur = feedRoot.querySelector('.feed-batch[data-seq="' + b.seq + '"]');
              if (cur) { cur.replaceChildren(sanitizeBatchHtml(b.html)); renderedRevs.set(b.seq, b.rev || 0); patchedNow = true; }
            } else if (b && typeof b.seq === "number" && !renderedSeqs.has(b.seq)) {
              renderedRevs.set(b.seq, b.rev || 0);
              const batchDiv = document.createElement("div");
              batchDiv.className = "feed-batch";
              batchDiv.setAttribute("data-seq", String(b.seq));
              batchDiv.appendChild(sanitizeBatchHtml(b.html));
              appendFrag.appendChild(batchDiv);
              renderedSeqs.add(b.seq);
            }
          }
          if (appendFrag.childNodes.length > 0) {
            feedRoot.appendChild(appendFrag);
          }
        }

        let maxSeq = -1;
        renderedSeqs.forEach((s) => {
          if (s > maxSeq) maxSeq = s;
        });
        nextExpectedSeq = maxSeq + 1;
        hasMore = Boolean(args.has_more);
        currentError = args.error_msg || "";
        inFlight = false;
        lastTotalCount = Number(args.total_count || 0);
        lastLoadedCount = incomingLoaded;
        lastNoun = args.noun || "items";

        renderFooter(
          lastTotalCount,
          lastLoadedCount,
          lastNoun,
          currentError
        );
        scheduleFrameHeight();
        setTimeout(scheduleScrollCheck, 80);
        if (patchedNow || firstRender) guardScroll(4000);
        firstRender = false;
      });

      bindParentScroll();
      sendMessage("streamlit:componentReady", { apiVersion: 1 });
      setFrameHeight();
    })();
  </script>
</body>
</html>
